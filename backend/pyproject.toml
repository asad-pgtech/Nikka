[project]
name = "lanchat-api"
version = "1.0.0"
description = "LAN Chat relay and directory API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pymongo>=4.13",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "pywebpush>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.uv]
package = false
